<title>Radio</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0a0a; --s1: #141414; --s2: #1e1e1e;
  --border: #282828; --text: #efefef;
  --muted: #555; --dim: #333;
  --accent: #4a9eff; --green: #3bba6e; --red: #e04466;
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; font-size: 14px; }
body { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

#player-bar { flex-shrink:0; border-bottom:1px solid var(--border); padding:14px 16px 12px; background:var(--s1); }
.p-name { font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.p-meta { display:flex; align-items:center; gap:8px; margin-top:4px; font-size:12px; color:var(--muted); }
.p-ctx { font-size:11px; color:var(--dim); margin-left:auto; }
.dot { width:6px; height:6px; border-radius:50%; background:var(--dim); flex-shrink:0; }
.dot.live { background:var(--green); animation:blink 1.4s infinite; }
.dot.loading { background:var(--accent); animation:blink .7s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.p-controls { display:flex; align-items:center; gap:20px; margin-top:12px; }
.btn-play { width:44px; height:44px; border-radius:50%; background:var(--text); color:var(--bg); border:none; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.btn-play:active { opacity:.7; }
.btn-skip { width:34px; height:34px; border-radius:50%; background:var(--s2); border:1px solid var(--border); color:var(--muted); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
.btn-skip:active { background:var(--border); }
.vol-wrap { flex:1; display:flex; align-items:center; gap:8px; }
.vol-wrap span { font-size:11px; color:var(--dim); }
input[type=range] { flex:1; -webkit-appearance:none; height:3px; background:var(--border); border-radius:2px; outline:none; cursor:pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--text); }

nav { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--bg); }
nav button { flex:1; padding:12px 0; background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .12s,border-color .12s; }
nav button.on { color:var(--text); border-bottom-color:var(--accent); }

main { flex:1; overflow:hidden; display:flex; flex-direction:column; }
.screen { display:none; flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; flex-direction:column; }
.screen.on { display:flex; }

.terr-row { display:flex; flex-shrink:0; border-bottom:1px solid var(--border); background:var(--bg); overflow-x:auto; scrollbar-width:none; }
.terr-row::-webkit-scrollbar { display:none; }
.t-btn { padding:11px 14px; background:none; border:none; border-right:1px solid var(--border); color:var(--muted); font-size:13px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .12s; }
.t-btn.on { color:var(--text); border-bottom-color:var(--accent); }

.search-bar { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
.search-bar input { flex:1; padding:11px 14px; background:var(--s1); border:none; color:var(--text); font-size:14px; outline:none; }
.search-bar input::placeholder { color:var(--muted); }
.search-bar button { padding:11px 14px; background:var(--s1); border:none; border-left:1px solid var(--border); color:var(--accent); font-size:13px; cursor:pointer; white-space:nowrap; }
.search-bar button:active { background:var(--s2); }

.list { flex:1; }
.list-row { display:flex; align-items:center; gap:10px; padding:11px 16px; border-bottom:1px solid var(--dim); cursor:pointer; }
.list-row:active { background:var(--s1); }
.list-row.active .row-name { color:var(--accent); }
.row-info { flex:1; min-width:0; }
.row-name { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row-sub { font-size:11px; color:var(--muted); margin-top:2px; }
.row-freq { font-size:12px; color:var(--muted); white-space:nowrap; flex-shrink:0; min-width:56px; text-align:right; }
.btn-fav { background:none; border:none; cursor:pointer; color:var(--dim); font-size:17px; padding:4px; flex-shrink:0; line-height:1; }
.btn-fav.on { color:var(--red); }
.btn-del { background:none; border:none; cursor:pointer; color:var(--dim); font-size:15px; padding:4px; flex-shrink:0; line-height:1; }

.msg { padding:32px 16px; text-align:center; color:var(--muted); font-size:13px; line-height:1.7; }

.add-bar { border-top:1px solid var(--border); padding:12px 16px; flex-shrink:0; background:var(--bg); }
.add-toggle { width:100%; padding:10px; background:none; border:1px dashed var(--border); border-radius:6px; color:var(--muted); font-size:13px; cursor:pointer; }
.add-form { display:none; margin-top:10px; }
.add-form.on { display:block; }
.add-form input { width:100%; padding:10px 12px; margin-bottom:8px; background:var(--s2); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; outline:none; }
.add-form input::placeholder { color:var(--muted); }
.add-form button { width:100%; padding:11px; background:var(--text); color:var(--bg); border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

<div id="player-bar">
  <div class="p-name" id="p-name">Sin emisora</div>
  <div class="p-meta">
    <span class="dot" id="dot"></span>
    <span id="p-status">Parado</span>
    <span id="p-freq" style="color:var(--accent)"></span>
    <span class="p-ctx" id="p-ctx"></span>
  </div>
  <div class="p-controls">
    <button class="btn-skip" id="btn-prev" aria-label="Anterior">&#9198;</button>
    <button class="btn-play" id="btn-play" aria-label="Play"><span id="play-icon">&#9654;</span></button>
    <button class="btn-skip" id="btn-next" aria-label="Siguiente">&#9197;</button>
    <div class="vol-wrap">
      <span>&#128264;</span>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
      <span>&#128266;</span>
    </div>
  </div>
</div>

<nav>
  <button class="on" id="tab-favs" onclick="showTab('favs')">Favoritos</button>
  <button id="tab-explore" onclick="showTab('explore')">Explorar</button>
</nav>

<main>
  <div class="screen on" id="screen-favs">
    <div class="list" id="fav-list"></div>
    <div class="add-bar">
      <button class="add-toggle" onclick="toggleAdd()">+ Añadir emisora manual</button>
      <div class="add-form" id="add-form">
        <input id="c-name" placeholder="Nombre" autocomplete="off">
        <input id="c-url" placeholder="URL stream (.mp3 .aac .m3u8)" autocomplete="off">
        <input id="c-freq" placeholder="Frecuencia FM (ej. 98.5) — opcional" autocomplete="off">
        <button onclick="saveCustom()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-explore">
    <div class="terr-row" id="terr-row"></div>
    <div class="search-bar">
      <input id="q" placeholder="Buscar por nombre..." autocomplete="off">
      <button onclick="doSearch()">Buscar</button>
    </div>
    <div class="list" id="explore-list"><div class="msg">Cargando...</div></div>
  </div>
</main>

<audio id="player" preload="none"></audio>

function ls(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

let favIds   = ls('rfavs',[]);
let customs  = ls('rcustoms',[]);
let curId    = ls('rcurId',null);
let playing  = false;
let addOpen  = false;
let activeTab  = 'favs';       // 'favs' | 'explore'
let activeTerr = 'es';
let exploreList = [];           // ordered list currently shown in explore
let smap = {};                  // id -> station

[...SPAIN,...VALENCIA].forEach(s=>smap[s.id]=s);
customs.forEach(s=>smap[s.id]=s);

const audio    = document.getElementById('player');
const playIcon = document.getElementById('play-icon');
const dot      = document.getElementById('dot');
const pStatus  = document.getElementById('p-status');
const pNameEl  = document.getElementById('p-name');
const pFreqEl  = document.getElementById('p-freq');
const pCtxEl   = document.getElementById('p-ctx');

function setStatus(st) {
  if (st==='live')  { dot.className='dot live';    pStatus.textContent='En directo';    playIcon.innerHTML='&#9646;&#9646;'; playing=true; }
  else if(st==='load'){ dot.className='dot loading'; pStatus.textContent='Conectando...'; playIcon.innerHTML='&#9646;&#9646;'; playing=true; }
  else              { dot.className='dot';          pStatus.textContent='Parado';        playIcon.innerHTML='&#9654;';        playing=false; }
}

function updatePlayerUI(s) {
  if (!s) { pNameEl.textContent='Sin emisora'; pFreqEl.textContent=''; pCtxEl.textContent=''; return; }
  pNameEl.textContent = s.name;
  pFreqEl.textContent = s.freq ? s.freq+' MHz' : '';
  // context label: which list the skip buttons will use
  if (activeTab==='favs') pCtxEl.textContent = 'Favoritos';
  else pCtxEl.textContent = TERRITORIES.find(t=>t.id===activeTerr)?.label || '';
}

// Returns the ordered list skip buttons should navigate
function currentList() {
  if (activeTab==='favs') return favIds.map(id=>smap[id]).filter(Boolean);
  return exploreList;
}

function playStation(id) {
  const s = smap[id]; if (!s) return;
  curId = id; ss('rcurId',curId);
  updatePlayerUI(s);
  audio.src = s.url; audio.load();
  setStatus('load');
  updateMediaSession(s.name);
  audio.play().catch(()=>{ setStatus('stop'); pStatus.textContent='Error de conexión'; });
  renderFavs();
  renderExploreRows();
}

function togglePlay() {
  if (!curId) { const l=currentList(); if(l[0]) playStation(l[0].id); return; }
  if (playing) { audio.pause(); setStatus('stop'); }
  else { setStatus('load'); audio.play().catch(()=>setStatus('stop')); }
}

function skip(d) {
  const list = currentList();
  if (!list.length) return;
  const i = list.findIndex(s=>s.id===curId);
  // If current station not in this list, start from beginning/end
  const next = i===-1 ? (d>0?0:list.length-1) : (i+d+list.length)%list.length;
  playStation(list[next].id);
}

function toggleFav(id,e) {
  e&&e.stopPropagation();
  if(favIds.includes(id)) favIds=favIds.filter(f=>f!==id);
  else favIds.unshift(id);
  ss('rfavs',favIds);
  renderFavs();
  renderExploreRows();
  if(activeTab==='favs') updatePlayerUI(smap[curId]);
}

function delCustom(id,e) {
  e&&e.stopPropagation();
  if(!confirm('¿Eliminar?')) return;
  customs=customs.filter(s=>s.id!==id);
  favIds=favIds.filter(f=>f!==id);
  delete smap[id];
  ss('rcustoms',customs); ss('rfavs',favIds);
  if(curId===id){audio.pause();setStatus('stop');curId=null;updatePlayerUI(null);}
  renderFavs();
}

function favList() { return favIds.map(id=>smap[id]).filter(Boolean); }

function renderFavs() {
  const fl=favList();
  const el=document.getElementById('fav-list');
  if(!fl.length){el.innerHTML='<div class="msg">Sin favoritos.<br>Explora y pulsa &#9829; para guardar.</div>';return;}
  el.innerHTML=fl.map(s=>{
    const isC=customs.find(c=>c.id===s.id);
    const del=isC?`<button class="btn-del" onclick="delCustom('${s.id}',event)">&#215;</button>`:'';
    return `<div class="list-row${s.id===curId?' active':''}" onclick="playStation('${s.id}')">
      <div class="row-info"><div class="row-name">${s.name}</div><div class="row-sub">${s.zone||''}</div></div>
      <span class="row-freq">${s.freq?s.freq+' MHz':''}</span>
      <button class="btn-fav on" onclick="toggleFav('${s.id}',event)">&#9829;</button>
      ${del}
    </div>`;
  }).join('');
}

function renderTerritories() {
  document.getElementById('terr-row').innerHTML=TERRITORIES.map(t=>
    `<button class="t-btn${t.id===activeTerr?' on':''}" onclick="selectTerritory('${t.id}')">${t.label}</button>`
  ).join('');
}

function renderExploreRows() {
  const el=document.getElementById('explore-list');
  if(!exploreList.length) return;
  el.innerHTML=exploreList.map(s=>
    `<div class="list-row${s.id===curId?' active':''}" onclick="playStation('${s.id}')">
      <div class="row-info"><div class="row-name">${s.name}</div><div class="row-sub">${s.zone||s.tags||''}</div></div>
      <span class="row-freq">${s.freq?s.freq+' MHz':'Online'}</span>
      <button class="btn-fav${favIds.includes(s.id)?' on':''}" onclick="toggleFav('${s.id}',event)">&#9829;</button>
    </div>`
  ).join('');
}

async function selectTerritory(id) {
  activeTerr=id; renderTerritories();
  document.getElementById('q').value='';
  await loadTerritory(id,'');
}

async function loadTerritory(id,q) {
  const t=TERRITORIES.find(x=>x.id===id);
  const el=document.getElementById('explore-list');
  el.innerHTML='<div class="msg">Cargando...</div>';
  const fixed=q?[]:(t.fixed||[]);
  try {
    const params=new URLSearchParams({countrycode:t.country,limit:80,order:'clickcount',reverse:true,hidebroken:true,...(q?{name:q}:{}),...(t.state?{state:t.state}:{})});
    const r=await fetch(`${API}/stations/search?${params}`,{headers:{'User-Agent':'RadioApp/1.0'}});
    const data=await r.json();
    const fetched=data.map(s=>({
      id:s.stationuuid,name:s.name.trim(),
      url:s.url_resolved||s.url,
      freq:s.frequency?parseFloat(s.frequency).toFixed(1):'',
      tags:s.tags?s.tags.split(',').slice(0,2).join(', '):'',
      zone:t.label,
    })).filter(s=>s.url&&s.name);
    const fixedNames=new Set(fixed.map(s=>s.name.toLowerCase()));
    exploreList=[...fixed,...fetched.filter(s=>!fixedNames.has(s.name.toLowerCase()))];
  } catch(e) {
    exploreList=fixed.length?fixed:[];
    if(!exploreList.length){el.innerHTML='<div class="msg">Error de conexión.</div>';return;}
  }
  exploreList.forEach(s=>smap[s.id]=s);
  // update context label if we're in explore
  if(activeTab==='explore') updatePlayerUI(smap[curId]);
  renderExploreRows();
}

async function doSearch() { await loadTerritory(activeTerr,document.getElementById('q').value.trim()); }
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

function toggleAdd() {
  addOpen=!addOpen;
  document.getElementById('add-form').className='add-form'+(addOpen?' on':'');
}
function saveCustom() {
  const name=document.getElementById('c-name').value.trim();
  const url=document.getElementById('c-url').value.trim();
  const freq=document.getElementById('c-freq').value.trim();
  if(!name||!url){alert('Nombre y URL son obligatorios');return;}
  const id='c_'+Date.now();
  const s={id,name,url,freq,zone:'Personalizada'};
  customs.push(s); smap[id]=s; favIds.unshift(id);
  ss('rcustoms',customs); ss('rfavs',favIds);
  ['c-name','c-url','c-freq'].forEach(i=>document.getElementById(i).value='');
  addOpen=false; document.getElementById('add-form').className='add-form';
  renderFavs();
}

function showTab(t) {
  activeTab=t;
  ['favs','explore'].forEach(x=>{
    document.getElementById('screen-'+x).classList.toggle('on',x===t);
    document.getElementById('tab-'+x).classList.toggle('on',x===t);
  });
  updatePlayerUI(smap[curId]);
  if(t==='explore'&&!exploreList.length) loadTerritory(activeTerr,'');
}
